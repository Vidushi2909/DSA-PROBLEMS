<!DOCTYPE html>
<html>
<head>
    <title>Server Validation Test</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #f44336;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin: 10px 0;
        }
        #result {
            background: #f5f5f5;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>Server-Side Validation Test</h2>
    <p>Click the button below to send INVALID data directly to the server (bypassing client validation):</p>
    
    <button onclick="testServerValidation()">Test Server Validation</button>
    
    <div id="result"></div>

    <script>
        async function testServerValidation() {
            document.getElementById('result').innerHTML = '<strong>Sending invalid data to server...</strong>';
            
            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'x',        // Too short - only 1 character
                        email: 'bademail',    // Invalid format - no @
                        password: '12'        // Too short - only 2 characters
                    })
                });
                
                const data = await response.json();
                
                document.getElementById('result').innerHTML = `
                    <h3>Data Sent to Server:</h3>
                    <pre>username: "x" (invalid - too short)
email: "bademail" (invalid - no @ symbol)
password: "12" (invalid - too short)</pre>
                    
                    <h3>Server Response:</h3>
                    <pre style="color: ${data.success ? 'green' : 'red'};">
Success: ${data.success}
Message: ${data.message}</pre>
                    
                    <h3>Result:</h3>
                    <p style="color: ${data.success ? 'red' : 'green'}; font-weight: bold;">
                        ${data.success ? 
                            '❌ FAILED - Server accepted invalid data!' : 
                            '✅ SUCCESS - Server rejected invalid data!'}
                    </p>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
